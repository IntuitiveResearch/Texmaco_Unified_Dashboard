<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="100%" height="100%">
  <defs>
    <linearGradient id="metalGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e3a8a"/>
      <stop offset="40%" stop-color="#2563eb"/>
      <stop offset="70%" stop-color="#1d4ed8"/>
      <stop offset="100%" stop-color="#172554"/>
    </linearGradient>
    <linearGradient id="bodyGrad" x1="0%" y1="20%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="25%" stop-color="#1d4ed8"/>
      <stop offset="70%" stop-color="#1e40af"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="pipeGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#60a5fa"/>
      <stop offset="50%" stop-color="#2563eb"/>
      <stop offset="100%" stop-color="#1e3a8a"/>
    </linearGradient>
    <linearGradient id="flangeGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#93c5fd"/>
      <stop offset="50%" stop-color="#2563eb"/>
      <stop offset="100%" stop-color="#1e3a8a"/>
    </linearGradient>
    <linearGradient id="skidGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e3a8a"/>
      <stop offset="100%" stop-color="#090d16"/>
    </linearGradient>
    <radialGradient id="endCapGrad" cx="30%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#60a5fa"/>
      <stop offset="60%" stop-color="#1d4ed8"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </radialGradient>
    <filter id="dropShadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="8" stdDeviation="6" flood-color="#000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Industrial Plant Background -->
  <rect width="600" height="400" fill="#cbd5e1" />
  <rect y="280" width="600" height="120" fill="#94a3b8" />
  
  <!-- Subtle background pipes & scaffolding -->
  <line x1="80" y1="0" x2="80" y2="280" stroke="#b0bec5" stroke-width="8" stroke-dasharray="2,2"/>
  <line x1="140" y1="0" x2="140" y2="280" stroke="#90a4ae" stroke-width="12"/>
  <line x1="140" y1="90" x2="600" y2="90" stroke="#90a4ae" stroke-width="8"/>
  <line x1="520" y1="0" x2="520" y2="280" stroke="#b0bec5" stroke-width="14"/>

  <!-- Skid Base (I-Beam frame) -->
  <g filter="url(#dropShadow)">
    <rect x="70" y="275" width="460" height="32" rx="3" fill="url(#skidGrad)"/>
    <rect x="75" y="300" width="450" height="8" fill="#1e293b"/>
    <rect x="110" y="307" width="40" height="12" fill="#0f172a"/>
    <rect x="250" y="307" width="40" height="12" fill="#0f172a"/>
    <rect x="390" y="307" width="40" height="12" fill="#0f172a"/>
    
    <!-- Mounting Bolts -->
    <circle cx="95" cy="290" r="4" fill="#fbbf24" stroke="#78350f" stroke-width="1"/>
    <circle cx="210" cy="290" r="4" fill="#fbbf24" stroke="#78350f" stroke-width="1"/>
    <circle cx="340" cy="290" r="4" fill="#fbbf24" stroke="#78350f" stroke-width="1"/>
    <circle cx="490" cy="290" r="4" fill="#fbbf24" stroke="#78350f" stroke-width="1"/>
  </g>

  <!-- Compressor Main Barrel/Housing -->
  <g filter="url(#dropShadow)">
    <!-- Main Cylinder -->
    <rect x="120" y="145" width="220" height="130" rx="8" fill="url(#bodyGrad)"/>
    <!-- Cylinder Ring Segments -->
    <line x1="165" y1="145" x2="165" y2="275" stroke="#172554" stroke-width="3"/>
    <line x1="168" y1="145" x2="168" y2="275" stroke="#60a5fa" stroke-width="1"/>
    <line x1="225" y1="145" x2="225" y2="275" stroke="#172554" stroke-width="3"/>
    <line x1="228" y1="145" x2="228" y2="275" stroke="#60a5fa" stroke-width="1"/>
    <line x1="285" y1="145" x2="285" y2="275" stroke="#172554" stroke-width="3"/>
    <line x1="288" y1="145" x2="288" y2="275" stroke="#60a5fa" stroke-width="1"/>

    <!-- Front Dome End-Cap -->
    <path d="M 120 145 C 90 145, 90 275, 120 275 Z" fill="url(#endCapGrad)"/>
    <!-- Flange ring on end cap -->
    <ellipse cx="120" cy="210" rx="6" ry="65" fill="url(#flangeGrad)" stroke="#1e3a8a" stroke-width="2"/>
    
    <!-- Bolts on Front Flange -->
    <circle cx="120" cy="155" r="3" fill="#cbd5e1"/>
    <circle cx="120" cy="175" r="3" fill="#cbd5e1"/>
    <circle cx="120" cy="195" r="3" fill="#cbd5e1"/>
    <circle cx="120" cy="215" r="3" fill="#cbd5e1"/>
    <circle cx="120" cy="235" r="3" fill="#cbd5e1"/>
    <circle cx="120" cy="255" r="3" fill="#cbd5e1"/>
    <circle cx="120" cy="270" r="3" fill="#cbd5e1"/>
  </g>

  <!-- Vertical Inlet / Discharge Piping with Flange (Top) -->
  <g filter="url(#dropShadow)">
    <rect x="180" y="65" width="55" height="85" fill="url(#pipeGrad)"/>
    <!-- Top Flange -->
    <rect x="165" y="55" width="85" height="15" rx="3" fill="url(#flangeGrad)"/>
    <!-- Flange Bolts -->
    <circle cx="175" cy="62" r="3" fill="#f8fafc"/>
    <circle cx="195" cy="62" r="3" fill="#f8fafc"/>
    <circle cx="215" cy="62" r="3" fill="#f8fafc"/>
    <circle cx="235" cy="62" r="3" fill="#f8fafc"/>
    <!-- Curved Pipe Elbow going up-right -->
    <path d="M 180 55 C 180 25, 235 25, 235 55" fill="none" stroke="#2563eb" stroke-width="24"/>
    <!-- Pressure Gauge -->
    <circle cx="255" cy="70" r="14" fill="#f8fafc" stroke="#334155" stroke-width="3"/>
    <line x1="255" y1="70" x2="262" y2="65" stroke="#ef4444" stroke-width="2"/>
    <circle cx="255" cy="70" r="2" fill="#000"/>
  </g>

  <!-- Interstage Piping / Coolant Line (Bottom side) -->
  <path d="M 130 260 C 130 290, 290 290, 290 260" fill="none" stroke="url(#pipeGrad)" stroke-width="16" filter="url(#dropShadow)"/>

  <!-- Drive Motor / Coupling Housing (Right side) -->
  <g filter="url(#dropShadow)">
    <!-- Bell housing / coupling -->
    <path d="M 340 160 L 375 170 L 375 250 L 340 260 Z" fill="#1e3a8a"/>
    <!-- Electric Drive Motor -->
    <rect x="375" y="155" width="130" height="110" rx="6" fill="url(#metalGrad)"/>
    <!-- Motor Cooling Fins -->
    <line x1="390" y1="155" x2="390" y2="265" stroke="#1e293b" stroke-width="2"/>
    <line x1="405" y1="155" x2="405" y2="265" stroke="#1e293b" stroke-width="2"/>
    <line x1="420" y1="155" x2="420" y2="265" stroke="#1e293b" stroke-width="2"/>
    <line x1="435" y1="155" x2="435" y2="265" stroke="#1e293b" stroke-width="2"/>
    <line x1="450" y1="155" x2="450" y2="265" stroke="#1e293b" stroke-width="2"/>
    <line x1="465" y1="155" x2="465" y2="265" stroke="#1e293b" stroke-width="2"/>
    <line x1="480" y1="155" x2="480" y2="265" stroke="#1e293b" stroke-width="2"/>

    <!-- Motor Terminal Box on top -->
    <rect x="415" y="132" width="45" height="23" rx="3" fill="#172554"/>
    <circle cx="437" cy="143" r="4" fill="#e2e8f0"/>

    <!-- Motor Rear Fan Cowling -->
    <path d="M 505 165 C 520 165, 520 255, 505 255 Z" fill="#0f172a"/>
  </g>

  <!-- IoT Vibration Sensors & Current Sensors with LEDs -->
  <g>
    <!-- MotionIQ Sensor on bearing housing -->
    <rect x="325" y="145" width="16" height="18" rx="2" fill="#0284c7" stroke="#38bdf8" stroke-width="1.5"/>
    <circle cx="333" cy="154" r="2.5" fill="#22c55e"/>

    <!-- Temperature Sensor probe -->
    <rect x="235" y="138" width="12" height="14" rx="2" fill="#e11d48" stroke="#f43f5e" stroke-width="1"/>
    <circle cx="241" cy="145" r="2" fill="#facc15"/>

    <!-- Wire conduits -->
    <path d="M 333 145 Q 350 110 420 120" fill="none" stroke="#64748b" stroke-width="2" stroke-dasharray="4,2"/>
    <path d="M 241 138 Q 280 100 420 120" fill="none" stroke="#64748b" stroke-width="2" stroke-dasharray="4,2"/>
  </g>

  <!-- Asset Label Plate on Machine -->
  <rect x="180" y="210" width="80" height="26" rx="3" fill="#0f172a" stroke="#94a3b8" stroke-width="1"/>
  <text x="220" y="228" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#38bdf8" text-anchor="middle">ROTARY SCREW</text>

  <!-- Ambient Shadow underneath -->
  <ellipse cx="300" cy="320" rx="240" ry="12" fill="#000" opacity="0.3"/>
</svg>
